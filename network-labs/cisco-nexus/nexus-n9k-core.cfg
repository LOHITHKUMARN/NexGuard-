! =====================================================================
! NexGuard Enterprise Data Center - Cisco Nexus (NX-OS) Configuration
! Platform: Cisco Nexus 9300 / 9000v Series (NX-OS 9.3+)
! Hostname: Nexus-DC-N9K
! Description: Data Center switching, vPC domain, LACP, VLAN 50 server farm
! =====================================================================

! Enable Required NX-OS Modular Features
feature vpc
feature lacp
feature interface-vlan
feature lldp
feature ssh

! Hostname & Domain
hostname Nexus-DC-N9K
ip domain-name dc.nexguard.enterprise.local

! Admin credentials
username admin password 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0 role network-admin

! Management VRF Configuration
vrf context management
  ip route 0.0.0.0/0 192.168.1.1

interface mgmt0
  description Out-of-Band Management
  vrf member management
  ip address 192.168.1.50/24
  no shutdown

! Virtual PortChannel (vPC) Domain Configuration
vpc domain 10
  role priority 1000
  peer-keepalive destination 192.168.1.51 source 192.168.1.50 vrf management
  peer-gateway
  auto-recovery
  system-priority 4096

! Data Center Server VLAN
vlan 50
  name DC_Server_Farm

! LACP Uplink Port-Channel to Campus Distribution Switch
interface Ethernet1/1
  description Uplink to Dist-Switch-01 Gi0/4
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 50
  channel-group 1 mode active
  no shutdown

interface Ethernet1/2
  description Uplink to Dist-Switch-01 Gi0/5
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 50
  channel-group 1 mode active
  no shutdown

interface port-channel 1
  description Core Distribution Uplink Trunk
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 50
  no shutdown

! Data Center Server Access Ports (Web, DB, DNS/DHCP)
interface Ethernet1/3
  description Connection to DC-Web-Server (UCS Blade 1)
  switchport
  switchport mode access
  switchport access vlan 50
  spanning-tree port type edge
  no shutdown

interface Ethernet1/4
  description Connection to DC-DB-Server (PowerEdge Blade 2)
  switchport
  switchport mode access
  switchport access vlan 50
  spanning-tree port type edge
  no shutdown

interface Ethernet1/5
  description Connection to DC-DNS-DHCP (Infrastructure Server)
  switchport
  switchport mode access
  switchport access vlan 50
  spanning-tree port type edge
  no shutdown

! Layer 3 Switched Virtual Interface (SVI)
interface Vlan50
  description SVI for Data Center Server Farm
  no shutdown
  ip address 192.168.50.2/24

! Save configuration to bootflash
! copy running-config startup-config
