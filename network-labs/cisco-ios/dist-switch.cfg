! =====================================================================
! NexGuard Enterprise Network - Campus Distribution Switch
! Platform: Cisco Catalyst 3560 / 3650 Series Switch
! Hostname: Dist-Switch-01
! Description: Core Distribution Layer, VLAN definition, Trunking, STP
! =====================================================================

version 15.0
service password-encryption
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname Dist-Switch-01
!
ip domain-name nexguard.enterprise.local
username admin privilege 15 secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0
enable secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0
!
spanning-tree mode rapid-pvst
spanning-tree extend system-id
spanning-tree vlan 10,20,30,40,50 priority 4096
!
! VLAN Definitions
vlan 10
 name HR
!
vlan 20
 name Finance
!
vlan 30
 name IT_Operations
!
vlan 40
 name Customer_Support
!
vlan 50
 name Data_Center_Servers
!
vlan 99
 name Management
!
! Core Router Trunk Interface
interface GigabitEthernet0/1
 description 802.1Q Trunk to Core-Router-01 Gi0/0
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,99
 switchport nonegotiate
!
! Access Switch 1 Trunk Interface (HR & Finance)
interface GigabitEthernet0/2
 description 802.1Q Trunk to Access-Switch-HR-Fin Gi0/24
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,99
!
! Access Switch 2 Trunk Interface (IT & Support)
interface GigabitEthernet0/3
 description 802.1Q Trunk to Access-Switch-IT-Supp Gi0/24
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 30,40,99
!
! Data Center Nexus Switch Link (Port-Channel Trunk)
interface GigabitEthernet0/4
 description Link to Nexus-DC-N9K Eth1/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 50,99
 channel-group 1 mode active
!
interface GigabitEthernet0/5
 description Link to Nexus-DC-N9K Eth1/2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 50,99
 channel-group 1 mode active
!
interface Port-channel 1
 description Port-Channel to Nexus N9K (LACP)
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 50,99
!
! Management SVI
interface Vlan1
 ip address 192.168.1.2 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.1.1
!
line con 0
 logging synchronous
line vty 0 4
 transport input ssh
 login local
!
end
