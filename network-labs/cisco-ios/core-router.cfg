! =====================================================================
! NexGuard Enterprise Network - Core / Inter-VLAN Router Configuration
! Platform: Cisco 2911 / 4321 Integrated Services Router (IOS 15.x)
! Hostname: Core-Router-01
! Description: Inter-VLAN routing, 802.1Q sub-interfaces, and DHCP relay
! =====================================================================

version 15.4
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname Core-Router-01
!
ip domain name nexguard.enterprise.local
!
! Generate RSA keys for SSH access
! crypto key generate rsa modulus 2048
!
username admin privilege 15 secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0
enable secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0
!
! AAA Configuration
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
! DHCP Exclusion Lists
ip dhcp excluded-address 192.168.10.1 192.168.10.10
ip dhcp excluded-address 192.168.20.1 192.168.20.10
ip dhcp excluded-address 192.168.30.1 192.168.30.10
ip dhcp excluded-address 192.168.40.1 192.168.40.10
ip dhcp excluded-address 192.168.50.1 192.168.50.25
!
! DHCP Pool for VLAN 10 (Human Resources)
ip dhcp pool POOL_HR_VLAN10
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.1
 dns-server 192.168.50.5 8.8.8.8
 domain-name hr.nexguard.local
 lease 7
!
! DHCP Pool for VLAN 20 (Finance)
ip dhcp pool POOL_FINANCE_VLAN20
 network 192.168.20.0 255.255.255.0
 default-router 192.168.20.1
 dns-server 192.168.50.5 8.8.8.8
 domain-name fin.nexguard.local
 lease 7
!
! DHCP Pool for VLAN 30 (IT Support)
ip dhcp pool POOL_IT_VLAN30
 network 192.168.30.0 255.255.255.0
 default-router 192.168.30.1
 dns-server 192.168.50.5 8.8.8.8
 domain-name it.nexguard.local
 lease 3
!
! DHCP Pool for VLAN 40 (Customer Support)
ip dhcp pool POOL_SUPPORT_VLAN40
 network 192.168.40.0 255.255.255.0
 default-router 192.168.40.1
 dns-server 192.168.50.5 8.8.8.8
 domain-name support.nexguard.local
 lease 1
!
! Physical Trunk Uplink to Distribution Switch
interface GigabitEthernet0/0
 description Trunk Uplink to Dist-Switch-01 Gi0/1
 no ip address
 duplex auto
 speed auto
 no shutdown
!
! Sub-interface VLAN 10 (HR)
interface GigabitEthernet0/0.10
 description Default Gateway for HR (VLAN 10)
 encapsulation dot1Q 10
 ip address 192.168.10.1 255.255.255.0
!
! Sub-interface VLAN 20 (Finance)
interface GigabitEthernet0/0.20
 description Default Gateway for Finance (VLAN 20)
 encapsulation dot1Q 20
 ip address 192.168.20.1 255.255.255.0
!
! Sub-interface VLAN 30 (IT)
interface GigabitEthernet0/0.30
 description Default Gateway for IT Operations (VLAN 30)
 encapsulation dot1Q 30
 ip address 192.168.30.1 255.255.255.0
!
! Sub-interface VLAN 40 (Support)
interface GigabitEthernet0/0.40
 description Default Gateway for Customer Support (VLAN 40)
 encapsulation dot1Q 40
 ip address 192.168.40.1 255.255.255.0
!
! Sub-interface VLAN 50 (Data Center & Servers)
interface GigabitEthernet0/0.50
 description Default Gateway for Data Center Servers (VLAN 50)
 encapsulation dot1Q 50
 ip address 192.168.50.1 255.255.255.0
!
! WAN / Upstream Interface
interface GigabitEthernet0/1
 description Primary WAN Internet Uplink
 ip address 10.0.0.1 255.255.255.252
 duplex auto
 speed auto
 no shutdown
!
! Management Loopback
interface Loopback0
 description Management Loopback ID
 ip address 1.1.1.1 255.255.255.255
!
ip forward-protocol nd
ip http server
ip http secure-server
!
! Line Configuration for SSH / Console
line con 0
 logging synchronous
 exec-timeout 15 0
line vty 0 4
 transport input ssh
 logging synchronous
 exec-timeout 15 0
!
end
