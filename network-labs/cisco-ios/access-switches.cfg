! =====================================================================
! NexGuard Enterprise Network - Access Layer Switches
! Platform: Cisco Catalyst 2960 Series
! Switch 1: HR-Fin-Switch-01 (HR & Finance Floors)
! Switch 2: IT-Supp-Switch-01 (IT & Customer Support Floors)
! =====================================================================

! ---------------------------------------------------------------------
! SECTION A: HR-Fin-Switch-01 (Serving VLAN 10 and VLAN 20)
! ---------------------------------------------------------------------
hostname HR-Fin-Switch-01
!
vlan 10
 name HR
vlan 20
 name Finance
!
! Trunk to Campus Distribution Switch
interface GigabitEthernet0/24
 description Trunk Uplink to Dist-Switch-01 Gi0/2
 switchport mode trunk
 switchport trunk allowed vlan 10,20
 no shutdown
!
! HR Department Access Ports (VLAN 10)
interface range FastEthernet0/1 - 10
 description HR Staff Workstations
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 no shutdown
!
! Finance Department Access Ports (VLAN 20)
interface range FastEthernet0/11 - 20
 description Finance Staff Workstations & Accounting Terminals
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 no shutdown
!
! Management Interface
interface Vlan1
 ip address 192.168.10.2 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.10.1
!

! ---------------------------------------------------------------------
! SECTION B: IT-Supp-Switch-01 (Serving VLAN 30 and VLAN 40)
! ---------------------------------------------------------------------
hostname IT-Supp-Switch-01
!
vlan 30
 name IT_Operations
vlan 40
 name Customer_Support
!
! Trunk to Campus Distribution Switch
interface GigabitEthernet0/24
 description Trunk Uplink to Dist-Switch-01 Gi0/3
 switchport mode trunk
 switchport trunk allowed vlan 30,40
 no shutdown
!
! IT Operations Access Ports (VLAN 30)
interface range FastEthernet0/1 - 10
 description IT Engineering & Jump Hosts
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
! Customer Support Access Ports (VLAN 40)
interface range FastEthernet0/11 - 20
 description Customer Support Agent Terminals
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
! Management Interface
interface Vlan1
 ip address 192.168.30.2 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.30.1
!
end
